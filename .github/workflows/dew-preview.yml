name: DEW Lounge preview

on:
  workflow_dispatch:
  push:
    branches:
      - dew/lounge-evaluation

permissions:
  contents: read

jobs:
  android:
    name: DEW Lounge preview
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v5
      - uses: pnpm/action-setup@v6
        with:
          version: 10
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: companion/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
        working-directory: companion
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android, armv7-linux-androideabi, wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            core
            plugins
      - run: cargo install cargo-ndk --version 4.1.2 --locked
      - name: Android NDK
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "ndk;27.2.12479018" > /dev/null
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/27.2.12479018" >> "$GITHUB_ENV"
      # Signed with a key made on the spot; only a release needs the real one.
      - name: Test Calendar and Sports plugins
        run: cargo test -p lounge-plugin-google-calendar -p lounge-plugin-dew-sports
        working-directory: plugins
      - run: tools/plugins/build.sh
      - name: Upload the Calendar and Sports plugins
        uses: actions/upload-artifact@v7
        with:
          name: dew-lounge-calendar-and-sports
          path: |
            android/app/src/main/assets/plugins/google-calendar.lgp
            android/app/src/main/assets/plugins/dew-sports.lgp
          if-no-files-found: error
      - name: Upload the plugin lockfile
        uses: actions/upload-artifact@v7
        with:
          name: plugin-lockfile
          path: plugins/Cargo.lock
          retention-days: 1
      - run: ./gradlew :core:design:testDebugUnitTest :core:platform:testDebugUnitTest :collector:media:testDebugUnitTest :power:testDebugUnitTest :update:testDebugUnitTest :feature:home:testDebugUnitTest :app:assembleRelease
        working-directory: android
      - uses: actions/upload-artifact@v7
        with:
          name: dew-lounge-preview
          path: android/app/build/outputs/apk/release/app-release.apk
